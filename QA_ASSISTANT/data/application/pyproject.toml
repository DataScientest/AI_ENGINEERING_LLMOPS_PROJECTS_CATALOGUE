[project]
name = "roombook"
version = "1.0.0"
description = "RoomBook: meeting-room booking service (system under test for the QA Assistant subject)"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110", "pydantic>=2.5", "uvicorn>=0.27"]

[project.optional-dependencies]
test = ["pytest>=8.0", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
